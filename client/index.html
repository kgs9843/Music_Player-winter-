<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Selector</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="overlay">
      <ul class="ul_container">
        <li class="title">Select Music</li>
        <li>
          <button class="btn" id="btnA" type="button">
            Snowflakes Falling Down by Simon Panrucker
          </button>
        </li>
        <li>
          <button class="btn" id="btnB" type="button">
            This Christmas by Dott
          </button>
        </li>
        <li>
          <button class="btn" id="btnC" type="button">
            No room at the inn by TRG Banks
          </button>
        </li>
        <li>
          <button class="btn" id="btnD" type="button">
            Jingle Bell Swing by Mark Smeby
          </button>
        </li>
        <li class="separator">OR</li>
        <li>
          <input type="file" id="upload" hidden />
          <label for="upload">Upload File</label>
        </li>
        <li class="separator">OR</li>
        <li>
          <div class="input_conatiner">
            <input
              type="text"
              id="youtubeUrl"
              placeholder="Paste YouTube URL here"
            />
            <button id="convertBtn">Convert & Play</button>
          </div>
        </li>
      </ul>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
